<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">PixelPTX — See your code become instructions.</title>
  <desc id="desc">A C++20 image-filter compiler. Follow the pipeline from source to AST, optimized IR, NVIDIA PTX, and CUBIN or SASS.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102d30"/><stop offset="1" stop-color="#172532"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b2ddd2" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="20" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="52" y="44" width="44" height="44" rx="11" fill="#8ed5bf"/>
    <path d="M63 54h14v10H63zm8 14h14v10H71z" fill="#133736"/>
    <text x="112" y="76" font-size="29" font-weight="700" fill="#f0f7f5">Pixel<tspan fill="#8ed5bf">PTX</tspan></text>
    <text x="1228" y="71" text-anchor="end" font-size="12" letter-spacing="2" fill="#9dbbb8">C++20 / NVIDIA PTX</text>
    <text x="52" y="153" font-size="46" font-weight="700" letter-spacing="-1" fill="#f0f7f5">See your code become instructions.</text>
    <text x="54" y="192" font-size="19" fill="#a9c3c0">Write a filter. Trace every rewrite. Inspect what reaches the GPU.</text>
    <path d="M67 260H1190" stroke="#41635f" stroke-width="2"/>
    <g fill="#173b3c" stroke="#628d83"><circle cx="68" cy="260" r="16"/><circle cx="348" cy="260" r="16"/><circle cx="628" cy="260" r="16"/><circle cx="908" cy="260" r="16"/><circle cx="1190" cy="260" r="16"/></g>
    <g fill="#a7e5d0" font-size="12" text-anchor="middle" font-weight="600"><text x="68" y="264">01</text><text x="348" y="264">02</text><text x="628" y="264">03</text><text x="908" y="264">04</text><text x="1190" y="264">05</text></g>
    <g fill="#d5e7e2" font-size="14" text-anchor="middle"><text x="68" y="307">Source</text><text x="348" y="307">Parse</text><text x="628" y="307">Optimize + lower</text><text x="908" y="307">Emit PTX</text><text x="1190" y="307">CUBIN / SASS</text></g>
  </g>
</svg>
